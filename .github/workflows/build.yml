name: Build WASD

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - build_files/**
      - system_files/**
      - wasd-icons/**
      - wasd-wallpapers/**
      - wasd-install/**
      - installer/**
      - Justfile
      - image-template.env
      - images.env
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      compression:
        description: Squashfs compression
        type: choice
        options:
          - fast
          - release
        default: fast

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # The runner user's podman is a wrapper that calls rootful podman. Job
  # steps do not load a shell profile, so the wrapper has to be on PATH here.
  PATH: /home/wasd-builder/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# One build at a time. A second push waits. This runner is only for pushes to
# main and manual runs, because the repo is public.
concurrency:
  group: wasd-hammerite
  cancel-in-progress: false

jobs:
  build:
    name: Image and live ISO (${{ matrix.variant }})
    runs-on: [self-hosted, hammerite]
    permissions:
      contents: read
      packages: write
    strategy:
      # One variant at a time. The two images do not fit on the builder together.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - variant: amd
            image_name: wasd
          - variant: nvidia
            image_name: wasd-nvidia
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      VARIANT: ${{ matrix.variant }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the builder
        run: |
          set -euo pipefail
          avail=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free space on /: ${avail}G"
          test "$avail" -ge 80
          test -d /mnt/wasd
          test -w /mnt/wasd
          podman info --format 'rootless={{.Host.Security.Rootless}} graph={{.Store.GraphRoot}}'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Check Just syntax
        run: just check

      - name: Image name and tag
        run: |
          set -euo pipefail
          echo "Building ${VARIANT} as ${IMAGE_NAME}"
          echo "DEFAULT_TAG=$(just generate-default-tag)" >> "$GITHUB_ENV"
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"

      - name: Build the image
        run: |
          set -euo pipefail
          # The push step logs in as this repo. A saved login makes the next
          # job's pull of the public Bazzite image fail with 403.
          podman logout ghcr.io || true
          just build "$IMAGE_NAME" "$DEFAULT_TAG" "$VARIANT"

      - name: Rechunk for smaller updates
        run: just ostree-rechunk "$IMAGE_NAME" "$DEFAULT_TAG"

      - name: Tag the image
        id: tag-images
        run: |
          set -euo pipefail
          alias_tags="$(just generate-build-tags "$IMAGE_NAME" "$DEFAULT_TAG")"
          echo "Tags: ${alias_tags}"
          just tag-images "$IMAGE_NAME" "$DEFAULT_TAG" "$alias_tags"
          echo "alias_tags=${alias_tags}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push the image
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.tag-images.outputs.alias_tags }}
        run: |
          set -euo pipefail
          rm -f digest
          for tag in ${ALIAS_TAGS}; do
            podman push --digestfile="$PWD/digest" "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          sudo -n /bin/chown "$(id -u):$(id -g)" digest
          digest=$(cat digest)
          echo "Pushed ${IMAGE_REGISTRY}/${IMAGE_NAME}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          # An empty password is a set variable. Unset makes cosign prompt and fail the job.
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [ -z "${COSIGN_PRIVATE_KEY}" ]; then
            echo "SIGNING_SECRET is not set. The image was pushed unsigned."
            exit 0
          fi
          curl -fsSL -o "$RUNNER_TEMP/cosign" -L https://github.com/sigstore/cosign/releases/download/v3.1.2/cosign-linux-amd64
          chmod +x "$RUNNER_TEMP/cosign"
          # Old bundle format, so rpm-ostree can verify a cosign 3 signature.
          # Signing must not block the ISO. The image is already on GHCR.
          if ! "$RUNNER_TEMP/cosign" sign -y --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"; then
            echo "Signing failed. Continuing with the ISO."
          fi

      - name: Build the live system
        env:
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          set -euo pipefail
          podman build \
            --cap-add sys_admin \
            --security-opt label=disable \
            --build-arg "BASE_IMAGE=${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --build-arg "INSTALL_IMAGE_PAYLOAD=${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            --build-arg FLATPAK_DIR_SHORTNAME=kde_flatpaks \
            -t "localhost/wasd-live:${VARIANT}" \
            installer/

      - name: Build the ISO
        run: |
          set -euo pipefail
          level=3
          if [ "${{ inputs.compression }}" = "release" ]; then
            level=19
          fi
          echo "Squashfs zstd level ${level}"
          mkdir -p output
          podman run --rm \
            --cap-add sys_admin \
            --security-opt label=disable \
            -e "SQUASHFS_COMPRESSION_LEVEL=${level}" \
            -v "$PWD/installer/build_iso.sh":/src/build_iso.sh:ro \
            --mount type=image,source=localhost/wasd-live:${VARIANT},dst=/rootfs \
            -v "$PWD/output":/output \
            quay.io/fedora/fedora:latest \
            /src/build_iso.sh
          sudo -n /bin/chown "$(id -u):$(id -g)" output/WASD.iso
          ls -lh output/WASD.iso

      - name: Publish the ISO
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          stamp=$(date -u +%Y%m%d)
          if [[ $VARIANT == nvidia ]]; then
            name="WASD-nvidia-${stamp}-${short_sha}.iso"
            latest_link="WASD-nvidia-latest.iso"
          else
            name="WASD-${stamp}-${short_sha}.iso"
            latest_link="WASD-latest.iso"
          fi
          install -m 0644 output/WASD.iso "/mnt/wasd/${name}"
          sha256sum "/mnt/wasd/${name}" | tee "/mnt/wasd/${name}.sha256"
          ln -sfn "${name}" "/mnt/wasd/${latest_link}"
          cp "/mnt/wasd/${name}.sha256" "/mnt/wasd/${latest_link}.sha256"
          # One copy of the five newest discs, AMD and NVIDIA together.
          # The latest links stay in the main folder. The other keepers
          # stay in archive/. Anything older is deleted.
          mkdir -p /mnt/wasd/archive
          shopt -s nullglob
          latest_names=()
          if [[ -L /mnt/wasd/WASD-latest.iso ]]; then
            latest_names+=("$(readlink /mnt/wasd/WASD-latest.iso)")
          fi
          if [[ -L /mnt/wasd/WASD-nvidia-latest.iso ]]; then
            latest_names+=("$(readlink /mnt/wasd/WASD-nvidia-latest.iso)")
          fi
          root_isos=(/mnt/wasd/WASD-[0-9]*.iso /mnt/wasd/WASD-nvidia-[0-9]*.iso)
          for iso in "${root_isos[@]}"; do
            base=$(basename "$iso")
            hold=0
            for kept in "${latest_names[@]}"; do
              [[ $base == "$kept" ]] && hold=1
            done
            if (( hold )); then
              continue
            fi
            mv -f "$iso" /mnt/wasd/archive/
            [[ -f ${iso}.sha256 ]] && mv -f "${iso}.sha256" /mnt/wasd/archive/
          done
          all_isos=(
            /mnt/wasd/WASD-[0-9]*.iso
            /mnt/wasd/WASD-nvidia-[0-9]*.iso
            /mnt/wasd/archive/WASD-[0-9]*.iso
            /mnt/wasd/archive/WASD-nvidia-[0-9]*.iso
          )
          if ((${#all_isos[@]})); then
            mapfile -t ordered < <(ls -1t "${all_isos[@]}")
            keep_paths=()
            count=0
            for iso in "${ordered[@]}"; do
              count=$((count + 1))
              if (( count <= 5 )); then
                keep_paths+=("$iso")
              fi
            done
            for kept in "${latest_names[@]}"; do
              [[ -n $kept ]] || continue
              if [[ -f /mnt/wasd/$kept ]]; then
                keep_paths+=("/mnt/wasd/$kept")
              elif [[ -f /mnt/wasd/archive/$kept ]]; then
                keep_paths+=("/mnt/wasd/archive/$kept")
              fi
            done
            for iso in "${ordered[@]}"; do
              saved=0
              for kept_path in "${keep_paths[@]}"; do
                [[ $iso == "$kept_path" ]] && saved=1
              done
              if (( saved )); then
                continue
              fi
              rm -f "$iso" "${iso}.sha256"
            done
            for kept in "${latest_names[@]}"; do
              [[ -n $kept && -f /mnt/wasd/archive/$kept ]] || continue
              mv -f "/mnt/wasd/archive/$kept" /mnt/wasd/
              [[ -f /mnt/wasd/archive/${kept}.sha256 ]] && mv -f "/mnt/wasd/archive/${kept}.sha256" /mnt/wasd/
            done
            for iso in "${keep_paths[@]}"; do
              [[ -f $iso ]] || continue
              base=$(basename "$iso")
              held=0
              for kept in "${latest_names[@]}"; do
                [[ $base == "$kept" ]] && held=1
              done
              if (( held )) || [[ $iso == /mnt/wasd/archive/* ]]; then
                continue
              fi
              mv -f "$iso" /mnt/wasd/archive/
              [[ -f ${iso}.sha256 ]] && mv -f "${iso}.sha256" /mnt/wasd/archive/
            done
          fi
          printf '%s\n' "${name}" > "/mnt/wasd/LATEST-${VARIANT}.txt"
          {
            [[ -f /mnt/wasd/LATEST-amd.txt ]] && cat /mnt/wasd/LATEST-amd.txt
            [[ -f /mnt/wasd/LATEST-nvidia.txt ]] && cat /mnt/wasd/LATEST-nvidia.txt
            true
          } > /mnt/wasd/LATEST.txt
          {
            echo "### Live ISO (${VARIANT})"
            echo
            echo "\`/mnt/wasd/${name}\` on angelwatch (\`main/wasd\`)."
            echo
            echo '```'
            cat "/mnt/wasd/${name}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Free builder disk
        if: always()
        run: |
          set -u
          base=$(awk -F= -v key="${VARIANT}_base" '$1 == key { print substr($0, index($0, "=") + 1); exit }' images.env)
          podman rmi -f "localhost/wasd-live:${VARIANT}" || true
          # Untagged images print as <none>, and that name does not remove them.
          while read -r id repo; do
            [[ -n $id ]] || continue
            name=${repo##*/}
            if [[ $name == "$IMAGE_NAME" || $name == "wasd-live" ]]; then
              podman rmi -f "$id" || true
            fi
          done < <(podman images --format '{{.ID}} {{.Repository}}')
          if [[ -n $base ]]; then
            podman rmi -f "$base" || true
          fi
          podman image prune -f || true
          podman logout ghcr.io || true
          rm -rf output
