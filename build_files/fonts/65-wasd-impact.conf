<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Anton answers requests for Impact Condensed and Impact. The family name stays Anton. -->
  <alias binding="strong">
    <family>Impact Condensed</family>
    <prefer><family>Anton</family></prefer>
  </alias>
  <alias binding="strong">
    <family>Impact</family>
    <prefer><family>Anton</family></prefer>
  </alias>
</fontconfig>
